<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brandresan - Admin Schema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/Brandresa/style.css" />
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
    }

    .admin-form {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 700;
      color: var(--ink);
    }

    input[type="text"],
    input[type="time"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-family: inherit;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .checkbox-group {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    input[type="checkbox"] {
      margin-right: 5px;
      cursor: pointer;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--line);
      color: var(--ink);
    }

    .btn-secondary:hover {
      opacity: 0.8;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    .lesson-item {
      background: #f9f9f9;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lesson-info {
      flex: 1;
    }

    .lesson-title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .lesson-meta {
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    .lesson-actions {
      display: flex;
      gap: 10px;
    }

    .lesson-actions button {
      padding: 8px 12px;
      font-size: 0.9rem;
    }

    .message {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="bg-noise" aria-hidden="true"></div>
  
  <div class="admin-container">
    <a href="/Brandresa/index.html" class="back-link">← Tillbaka till schema</a>
    
    <h1>Brandresan - Redigera schema</h1>

    <div id="message"></div>

    <div class="admin-form">
      <h2>Lägg till ny lektion</h2>

      <div class="form-group">
        <label>Datum <span style="color:var(--accent)">*</span></label>
        <div class="cal-widget">
          <div class="cal-w-header">
            <button type="button" class="cal-w-nav" onclick="calPrev()">&#9664; Föreg</button>
            <strong id="cal-title" class="cal-w-title"></strong>
            <button type="button" class="cal-w-nav" onclick="calNext()">Nästa &#9654;</button>
          </div>
          <div class="cal-w-weekdays">
            <span>Mån</span><span>Tis</span><span>Ons</span><span>Tors</span><span>Fre</span><span>Lör</span><span>Sön</span>
          </div>
          <div id="cal-grid" class="cal-w-grid"></div>
          <p id="cal-label" class="cal-w-label">Inget datum valt</p>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="title">Lektionsnamn</label>
          <input type="text" id="title" placeholder="t.ex. Rokdykning - grundteknik">
        </div>
        
        <div class="form-group">
          <label for="instructor">Instruktör</label>
          <input type="text" id="instructor" placeholder="t.ex. Anna Berg">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="startTime">Starttid</label>
          <input type="time" id="startTime">
        </div>
        
        <div class="form-group">
          <label for="endTime">Sluttid</label>
          <input type="time" id="endTime">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="location">Plats</label>
          <input type="text" id="location" placeholder="t.ex. Övningsfält A">
        </div>
        
        <div class="form-group">
          <label for="type">Typ</label>
          <input type="text" id="type" placeholder="t.ex. Praktik, Teori, Workshop">
        </div>
      </div>

      <div class="form-group">
        <label for="focus">Information/Fokus</label>
        <textarea id="focus" placeholder="Beskrivning av lektionen..."></textarea>
      </div>

      <div class="form-group">
        <label>Utrustning att ta med:</label>
        <div class="checkbox-group">
          <label>
            <input type="checkbox" id="equip-larmstall"> Larmställ
          </label>
          <label>
            <input type="checkbox" id="equip-civila"> Civila kläder
          </label>
          <label>
            <input type="checkbox" id="equip-understall"> Underställ
          </label>
        </div>
      </div>

      <div class="button-group">
        <button class="btn-primary" onclick="addLesson()">Lägg till lektion</button>
        <button class="btn-secondary" onclick="addBreak()">Lägg till rast</button>
        <button class="btn-secondary" onclick="clearForm()">Rensa formulär</button>
      </div>
    </div>

    <div>
      <h2>Befintliga lektioner</h2>
      <div id="lessonsList"></div>

    </div>
  </div>

  <script src="/Brandresa/config.js"></script>
  <script src="/Brandresa/admin.js"></script>
</body>
</html>
