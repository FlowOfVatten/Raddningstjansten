<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brandresan - Schema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-noise" aria-hidden="true"></div>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="kicker">Raddningstjansten</p>
        <h1>Brandresan - Dagens schema</h1>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px;">
        <p id="todayLabel" class="today"></p>
        <a href="admin.html" style="font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 700;">⚙ Admin</a>
      </div>
    </header>

    <section class="content-grid">
      <section class="panel schedule-panel">
        <div class="panel-head">
          <h2>Lektioner</h2>
          <span id="countBadge" class="badge"></span>
        </div>
        <p class="hint">Välj en lektion för att se utrustning och fokus.</p>
        <div id="scheduleList" class="schedule-list" role="list"></div>
      </section>

      <section class="panel detail-panel">
        <div id="emptyState" class="empty-state">
          <h2>Ingen lektion vald</h2>
          <p>Klicka på en lektion till vänster för att se detaljer.</p>
        </div>

        <article id="detailCard" class="detail-card hidden" aria-live="polite">
          <div class="detail-top">
            <p id="detailTime" class="detail-time"></p>
            <span id="detailType" class="badge type-badge"></span>
          </div>
          <h2 id="detailTitle"></h2>
          <p id="detailLocation" class="detail-meta"></p>
          <p id="detailInstructor" class="detail-meta"></p>

          <section>
            <h3>Utrustning att ta med</h3>
            <ul id="equipmentList"></ul>
          </section>

          <section>
            <h3>Fokus för passet</h3>
            <p id="detailFocus" class="focus"></p>
          </section>
        </article>
      </section>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
