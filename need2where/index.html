<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>need2where - Behovsbaserad platsokning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

    <main class="layout">
      <section class="panel panel-input">
        <p class="eyebrow">Need-first local search</p>
        <h1>need2where</h1>
        <p class="lead">
          Skriv vad du vill ha. Vi mappar behov till vad som faktiskt saljer det i landet du ar i.
        </p>

        <form id="search-form" class="controls">
          <label for="need">Vad behovs?</label>
          <select id="need" required>
            <option value="tobacco">Cigaretter / Tobak</option>
            <option value="alcohol">Ol / Alkohol</option>
            <option value="pharmacy">Apotek</option>
            <option value="food">Snabbmat / Mat</option>
            <option value="sim">SIM-kort</option>
            <option value="toilet">Toalett</option>
          </select>

          <div class="actions">
            <button type="button" id="locate-btn" class="btn btn-secondary">Hamta min position</button>
            <button type="submit" class="btn btn-primary">Hitta narmaste</button>
          </div>
        </form>

        <div id="status" class="status" role="status" aria-live="polite"></div>

        <article class="rule-card">
          <h2>Landsregel</h2>
          <p id="rule-explanation">Ingen regel inlast annu.</p>
          <p class="disclaimer">Observera: Datat visar var varan normalt kan finnas, inte garanti for lagerstatus.</p>
        </article>
      </section>

      <section class="panel panel-map">
        <div id="map" aria-label="Karta"></div>
        <div class="results-wrap">
          <h2>Forslag nara dig</h2>
          <ul id="results" class="results"></ul>
        </div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./app.js" defer></script>
  </body>
</html>
