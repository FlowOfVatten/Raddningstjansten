[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo \"window.APP_CONFIG = { supabaseUrl: '$SUPABASE_URL', supabaseAnonKey: '$SUPABASE_ANON_KEY' };\" > config.js"

[functions]
  node_bundler = "esbuild"

[context.production.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"