<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URF - Uppsala Reggae Festival | Billånning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="sync-container">
                <div id="syncStatus" class="sync-status">Last data: lokal cache</div>
                <button id="refreshButton" class="refresh-button" onclick="handleRefreshSync()" title="Force manual sync">🔄</button>
            </div>
            <div id="scheduleTestBadge" class="schedule-test-badge" style="display:none;"></div>
            <img src="URF2022_Logo_White_H-1-1024x604.webp" alt="URF Logo" class="header-logo">
            <div class="header-content">
                <h1>🎶 URF 🎶</h1>
                <p class="subtitle subtitle-main">SAMBAND</p>
                <p class="subtitle subtitle-tagline">One crew to rule them all</p>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('cars')">Bilar</button>
            <button class="tab-button" onclick="switchTab('keys')">Diverse</button>
            <button class="tab-button" onclick="switchTab('booking')">📅 Bokningar</button>
            <button class="tab-button" onclick="switchTab('contacts')">Kontakter</button>
        </div>

        <section id="cars-section" class="tab-section active">
            <main class="cars-grid" id="carsContainer">
                <!-- Bilkort skapas dynamiskt med JavaScript -->
            </main>
            <div class="list-actions">
                <button class="add-row-button" onclick="openNewCarModal()">Ny Bil</button>
            </div>
        </section>

        <section id="keys-section" class="tab-section">
            <main class="keys-grid" id="keysContainer">
                <!-- Nyckelkort skapas dynamiskt med JavaScript -->
            </main>
            <div class="list-actions">
                <button class="add-row-button" onclick="addKeyItem()">Ny Pryl</button>
            </div>
        </section>

        <section id="booking-section" class="tab-section">
            <div class="booking-day-selector">
                <button class="day-btn active" onclick="switchBookingDay('friday')">Fredag</button>
                <button class="day-btn" onclick="switchBookingDay('saturday')">Lördag</button>
            </div>
            <div class="booking-grid-container" id="bookingGrid">
                <!-- Bokningstabell skapas dynamiskt med JavaScript -->
            </div>
        </section>

        <section id="contacts-section" class="tab-section">
            <main class="contacts-list" id="contactsContainer">
                <!-- Kontakter skapas dynamiskt med JavaScript -->
            </main>
            <div class="list-actions">
                <button class="add-row-button" onclick="openNewContactModal()">Ny kontakt</button>
            </div>
        </section>
    </div>

    <!-- Pop-up för låning -->
    <div id="borrowModal" class="modal">
        <div class="modal-content">
            <h2>Låna bil</h2>
            <p id="borrowCarInfo"></p>
            <p id="borrowCarNotice" class="borrow-notice" style="display:none;"></p>
            <div id="borrowCarSuggestion" class="borrow-suggestion" style="display:none;"></div>
            <div class="form-group">
                <label for="borrowName">Namn:</label>
                <input type="text" id="borrowName" placeholder="Ditt namn">
            </div>
            <div class="modal-buttons">
                <button class="btn-ok" onclick="confirmBorrow()">OK</button>
                <button class="btn-cancel" onclick="closeModal()">Avbryt</button>
            </div>
        </div>
    </div>

    <!-- Pop-up för återlämning av bil -->
    <div id="returnModal" class="modal">
        <div class="modal-content">
            <h2>Är bilen tillbaka?</h2>
            <p id="returnCarInfo"></p>
            <div class="modal-buttons">
                <button class="btn-ok" onclick="confirmReturn()">Ja, bilen är tillbaka</button>
                <button class="btn-cancel" onclick="closeModal()">Nej, håller på ännu</button>
            </div>
        </div>
    </div>

    <!-- Pop-up för att låna från diverse -->
    <div id="borrowKeyModal" class="modal">
        <div class="modal-content">
            <h2>Låna pryl</h2>
            <p id="borrowKeyInfo"></p>
            <div class="form-group">
                <label for="borrowKeyName">Namn:</label>
                <input type="text" id="borrowKeyName" placeholder="Ditt namn">
            </div>
            <div class="modal-buttons">
                <button class="btn-ok" onclick="confirmBorrowKey()">OK</button>
                <button class="btn-cancel" onclick="closeModal()">Avbryt</button>
            </div>
        </div>
    </div>

    <!-- Pop-up för återlämning från diverse -->
    <div id="returnKeyModal" class="modal">
        <div class="modal-content">
            <h2>Är prylen tillbaka?</h2>
            <p id="returnKeyInfo"></p>
            <div class="modal-buttons">
                <button class="btn-ok" onclick="confirmReturnKey()">Ja, prylen är tillbaka</button>
                <button class="btn-cancel" onclick="closeModal()">Nej, håller på ännu</button>
            </div>
        </div>
    </div>

    <!-- Pop-up för ny bokning -->
    <div id="newCarModal" class="modal">
        <div class="modal-content">
            <h2>Ny bil / minibuss</h2>
            <div class="form-group">
                <label for="newCarModel">Modell:</label>
                <input type="text" id="newCarModel" placeholder="Ex: Volkswagen Transporter">
            </div>
            <div class="form-group">
                <label for="newCarReg">Reg.nr:</label>
                <input type="text" id="newCarReg" placeholder="Ex: ABC123">
            </div>
            <div class="form-group">
                <label for="newCarType">Fordonstyp:</label>
                <select id="newCarType">
                    <option value="car">Bil</option>
                    <option value="minibus">Minibuss</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button class="btn-ok" onclick="confirmNewCar()">Lägg till</button>
                <button class="btn-cancel" onclick="closeModal()">Avbryt</button>
            </div>
        </div>
    </div>

    <!-- Pop-up för ny bokning -->
    <div id="newBookingModal" class="modal">
        <div class="modal-content">
            <h2>Boka bil</h2>
            <p id="newBookingInfo"></p>
            <div class="form-group">
                <label for="bookingName">Namn:</label>
                <input type="text" id="bookingName" placeholder="Ditt namn">
            </div>
            <div class="form-group">
                <label for="bookingEndHour">Sluttid:</label>
                <select id="bookingEndHour">
                </select>
            </div>
            <div class="form-group">
                <label for="bookingComment">Kommentar (valfritt):</label>
                <input type="text" id="bookingComment" placeholder="Anledning / notering">
            </div>
            <div class="modal-buttons">
                <button class="btn-ok" onclick="confirmNewBooking()">Boka</button>
                <button class="btn-cancel" onclick="closeModal()">Avbryt</button>
            </div>
        </div>
    </div>

    <!-- Pop-up för att ta bort bokning -->
    <div id="cancelBookingModal" class="modal">
        <div class="modal-content">
            <h2>Ta bort bokning?</h2>
            <p id="cancelBookingInfo"></p>
            <div class="modal-buttons">
                <button id="markReturnedBookingBtn" class="btn-ok" onclick="confirmReturnBooking()">Återlämnad</button>
                <button class="btn-taken" style="flex:1;padding:12px;font-size:1.1em;font-weight:bold;border:none;border-radius:10px;cursor:pointer;text-transform:uppercase;" onclick="confirmCancelBooking()">Ta bort</button>
                <button class="btn-cancel" onclick="closeModal()">Behåll</button>
            </div>
        </div>
    </div>

    <!-- Pop-up för att ta bort fordon -->
    <div id="deleteCarModal" class="modal">
        <div class="modal-content">
            <h2>Ta bort fordon?</h2>
            <p id="deleteCarInfo"></p>
            <div class="modal-buttons">
                <button class="btn-taken" style="flex:1;padding:12px;font-size:1.1em;font-weight:bold;border:none;border-radius:10px;cursor:pointer;text-transform:uppercase;" onclick="confirmDeleteCar()">Ta bort</button>
                <button class="btn-cancel" onclick="closeModal()">Avbryt</button>
            </div>
        </div>
    </div>

    <!-- Pop-up för ny kontakt -->
    <div id="newContactModal" class="modal">
        <div class="modal-content">
            <h2>Ny kontakt</h2>
            <div class="form-group">
                <label for="contactName">Namn:</label>
                <input type="text" id="contactName" placeholder="Namn">
            </div>
            <div class="form-group">
                <label for="contactPhone">Telefonnummer:</label>
                <input type="text" id="contactPhone" placeholder="Telefonnummer">
            </div>
            <div class="form-group">
                <label for="contactNote">Notering:</label>
                <input type="text" id="contactNote" placeholder="Notering">
            </div>
            <div class="modal-buttons">
                <button class="btn-ok" onclick="confirmNewContact()">Spara</button>
                <button class="btn-cancel" onclick="closeModal()">Avbryt</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
