<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmälningslistor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="public">
  <div class="page-shell">
    <header class="hero public-hero">
      <div>
        <p class="eyebrow">Uppsala Brandförsvar</p>
        <p class="eyebrow eyebrow-sub">Tierp Uppsala Östhammar</p>
        <div class="hero-title-with-logo">
          <img
            class="hero-logo"
            src="https://uppsalabrandforsvar.se/Content/Images/Gfx/brf_logo.svg"
            alt="Uppsala brandförsvar"
          >
          <div class="hero-title-text">
            <h1>Kommande övningar</h1>
            <p id="hero-motto" class="hero-motto"></p>
            <p class="hero-copy">Varje tillfälle visar plats, tid, min/max antal och aktuell deltagarlista.</p>
          </div>
        </div>
      </div>
      <div class="hero-actions">
        <button id="btn-admin-login" class="btn btn-secondary" type="button">Admin</button>
        <button id="btn-open-smoke-view" class="btn btn-secondary" type="button">Rökövning</button>
        <button id="btn-open-admin" class="btn btn-primary" type="button" hidden>Skapa övning</button>
      </div>
      <button id="btn-refresh-data" class="btn btn-secondary btn-sm refresh-btn" type="button" title="Uppdatera data från servern">🔄 Uppdatera</button>
    </header>

    <main class="public-layout">
      <section class="panel overview-panel">
        <div id="public-events-view">
          <div class="split-row">
            <select id="public-event-select" class="input"></select>
          </div>
          <div id="public-events" class="public-events"></div>
        </div>
        <div id="public-smoke-view" hidden>
          <div class="split-row">
            <select id="public-smoke-station-select" class="input"></select>
          </div>
          <div id="public-smoke-drills" class="public-events"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="signup-modal" class="modal-overlay" hidden>
    <div class="modal-box modal-box--medium">
      <h3 id="signup-modal-title" class="modal-title">Anmäl dig</h3>
      <p id="signup-modal-subtitle" class="modal-hint"></p>
      <div class="stack gap-sm">
        <label class="field-label" for="signup-station">Station</label>
        <select id="signup-station" class="input"></select>
      </div>
      <div id="signup-name-container" class="stack gap-sm">
        <label class="field-label" for="signup-name">Namn</label>
        <input id="signup-name" class="input" type="text" placeholder="Förnamn Efternamn">
      </div>
      <div class="modal-actions">
        <div class="modal-actions-right">
          <button id="btn-signup-cancel" class="btn btn-secondary" type="button">Avbryt</button>
          <button id="btn-signup-save" class="btn btn-primary" type="button">Spara anmälan</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
