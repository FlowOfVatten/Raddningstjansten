<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Experiment - Resultat</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page results">
    <header class="hero">
      <p class="kicker">Resultat</p>
      <h1>Gruppens prioriteringsmonster</h1>
      <p class="sub">Anonymt och i realtid.</p>
    </header>

    <section class="card controls">
      <label for="sessionId">Session-ID</label>
      <input id="sessionId" autocomplete="off">
      <button id="loadResults" type="button">Hamta resultat</button>
      <p id="loadStatus" class="muted"></p>
    </section>

    <section class="card" id="resultCard" hidden>
      <h2 id="phaseTitle">Scenario</h2>
      <p id="totals"></p>
      <button id="exportCsv" type="button">Exportera CSV</button>
      <div id="bars" class="bars"></div>
      <p class="muted">Exporten innehaller endast anonymiserad gruppdata per val.</p>
    </section>
  </main>

  <script src="./results.js"></script>
</body>
</html>
