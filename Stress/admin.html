<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operational Overload - Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Admin panel</p>
        <h1>Operational Overload / Stress</h1>
      </div>
    </header>

    <section class="panel">
      <h2>Session</h2>
      <div class="row">
        <button id="createSession" type="button">Skapa session</button>
      </div>
      <div class="task-form">
        <label>Session ID <input id="sessionId" readonly></label>
        <label>Admin key <input id="adminKey" readonly></label>
        <label>Speltid (sek) <input id="durationSec" type="number" min="60" max="1200" value="600"></label>
      </div>
      <div class="row">
        <button id="startGame" type="button">Starta spel</button>
        <button id="showResults" type="button">Visa resultat</button>
      </div>
      <p id="adminStatus">Ingen aktiv session.</p>
      <p id="participantLink"></p>
    </section>

    <section class="hud">
      <article>
        <p class="label">Fas</p>
        <p class="value" id="phaseValue">-</p>
      </article>
      <article>
        <p class="label">Deltagare</p>
        <p class="value" id="participantCount">0</p>
      </article>
      <article>
        <p class="label">Inskickade</p>
        <p class="value" id="submissionCount">0</p>
      </article>
      <article>
        <p class="label">Tid kvar</p>
        <p class="value" id="timeLeft">--</p>
      </article>
    </section>

    <section class="panel">
      <h2>Leaderboard</h2>
      <div id="leaderboard">Inga resultat an.</div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
