<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPA Admin Panel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
    }
    #adminContainer {
      display: flex;
      height: 100vh;
    }
    #mapContainer {
      flex: 1;
      background: #1a1a1a;
    }
    .sidebar {
      width: 350px;
      background: #1a1a1a;
      border-left: 2px solid #ffff00;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    h1 { color: #ffff00; margin-bottom: 1rem; font-size: 1.5rem; }
    h2 { color: #ffff00; margin: 1rem 0 0.5rem 0; font-size: 1.2rem; }
    .form-group {
      margin: 1rem 0;
      display: flex;
      flex-direction: column;
    }
    label {
      color: #ccc;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
    }
    input, textarea, select {
      padding: 0.75rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid #ffff00;
      color: #fff;
      border-radius: 4px;
      font-family: inherit;
    }
    input::placeholder { color: #666; }
    button {
      padding: 0.75rem 1.5rem;
      background: #ff6600;
      border: none;
      color: #000;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin: 0.5rem 0;
    }
    button:hover { background: #ffff00; }
    .poi-list, .player-list {
      border: 1px solid #ffff00;
      padding: 1rem;
      border-radius: 4px;
      margin: 1rem 0;
      background: rgba(255,255,0,0.05);
    }
    .poi-item, .player-item {
      padding: 0.75rem;
      margin: 0.5rem 0;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .poi-item button, .player-item button {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      margin: 0;
    }
    .password-section {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #ffff00;
    }
    .info-text {
      color: #888;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    .success {
      background: #00aa00;
      color: #fff;
      padding: 0.75rem;
      border-radius: 4px;
      margin: 0.5rem 0;
    }
    .error {
      background: #aa0000;
      color: #fff;
      padding: 0.75rem;
      border-radius: 4px;
      margin: 0.5rem 0;
    }
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
    }
    .sidebar-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="adminContainer">
    <div id="mapContainer"></div>
    
    <div class="sidebar">
      <h1>EPA Admin</h1>
      
      <div class="password-section">
        <div class="form-group">
          <label>Admin Lösenord</label>
          <input type="password" id="adminPassword" placeholder="Lösenord">
        </div>
        <button onclick="authenticateAdmin()">Logga in</button>
        <div id="authStatus"></div>
      </div>
      
      <div class="sidebar-content" id="adminContent" style="display: none;">
        <h2>Ny POI</h2>
        <div class="form-group">
          <label>POI Namn</label>
          <input type="text" id="poiName" placeholder="Platsens namn">
        </div>
        <div class="form-group">
          <label>Radie (meter)</label>
          <input type="number" id="poiRadius" value="40" min="10" max="500">
        </div>
        <div class="form-group">
          <label>Fråga</label>
          <textarea id="poiQuestion" placeholder="Frågetexten" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Svarsalternativ (kommaseparerat)</label>
          <textarea id="poiAnswers" placeholder="Svar 1, Svar 2, Svar 3, Svar 4" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Rätt svar (1-4)</label>
          <input type="number" id="poiCorrectAnswer" value="1" min="1" max="4">
        </div>
        <div class="form-group">
          <label>Ledtråd (valfritt)</label>
          <input type="text" id="poiHint" placeholder="En ledande ledtråd">
        </div>
        <div class="form-group">
          <label style="color: #aaa; font-size: 0.85rem;">Klicka på kartan för att sätta koordinater</label>
          <input type="text" id="poiCoords" readonly placeholder="Lat, Lng" style="opacity: 0.5;">
        </div>
        <button onclick="addPOI()">Lägg till POI</button>
        <div id="poiMessage"></div>

        <h2>POI:er</h2>
        <div id="poiList" class="poi-list"></div>

        <h2>Spelare</h2>
        <button onclick="loadPlayers()">Uppdatera spellista</button>
        <div id="playerList" class="player-list"></div>

        <h2>Åtgärder</h2>
        <div class="sidebar-actions">
          <button onclick="resetAllGames()" style="background: #aa0000;">Nollställ alla spel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map;
    let adminPassword = null;
    let selectedCoords = null;
    let pois = [];

    function initMap() {
      map = L.map('mapContainer').setView([56.88, 15.63], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      map.on('click', (e) => {
        selectedCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
        document.getElementById('poiCoords').value = 
          selectedCoords.lat.toFixed(6) + ', ' + selectedCoords.lng.toFixed(6);
        
        L.circleMarker(e.latlng, {
          radius: 10,
          fillColor: '#ffff00',
          color: '#ffff00',
          weight: 2,
          fillOpacity: 0.7
        }).addTo(map);
      });

      loadPOIs();
    }

    async function authenticateAdmin() {
      adminPassword = document.getElementById('adminPassword').value;
      const authStatus = document.getElementById('authStatus');

      try {
        const response = await fetch('/api/epa/admin/players?password=' + encodeURIComponent(adminPassword));
        if (!response.ok) throw new Error('Autentisering misslyckades');

        document.getElementById('adminContent').style.display = 'block';
        authStatus.innerHTML = '<div class="success">Inloggad</div>';
      } catch (err) {
        authStatus.innerHTML = '<div class="error">Felaktigt lösenord</div>';
        adminPassword = null;
      }
    }

    async function addPOI() {
      if (!adminPassword || !selectedCoords) {
        alert('Logga in och klicka på kartan för att sätta koordinater');
        return;
      }

      const poiName = document.getElementById('poiName').value;
      const poiRadius = parseInt(document.getElementById('poiRadius').value);
      const poiQuestion = document.getElementById('poiQuestion').value;
      const poiAnswers = document.getElementById('poiAnswers').value.split(',').map(s => s.trim());
      const correctAnswer = parseInt(document.getElementById('poiCorrectAnswer').value) - 1;
      const poiHint = document.getElementById('poiHint').value;

      if (!poiName || !poiQuestion || poiAnswers.length < 2) {
        alert('Fyll i alla obligatoriska fält');
        return;
      }

      try {
        // Add POI
        const poiResponse = await fetch('/api/epa/admin/poi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: adminPassword,
            namn: poiName,
            lat: selectedCoords.lat,
            lng: selectedCoords.lng,
            radieMeter: poiRadius
          })
        });

        if (!poiResponse.ok) throw new Error('Kunde inte lägga till POI');
        const poiData = await poiResponse.json();

        // Add question
        const questionResponse = await fetch(`/api/epa/admin/poi/${poiData.id}/question`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: adminPassword,
            text: poiQuestion,
            alternativ: poiAnswers,
            rattIndex: correctAnswer,
            ledtrad: poiHint || null
          })
        });

        if (!questionResponse.ok) throw new Error('Kunde inte lägga till fråga');

        document.getElementById('poiMessage').innerHTML = '<div class="success">POI tillagd!</div>';
        document.getElementById('poiName').value = '';
        document.getElementById('poiQuestion').value = '';
        document.getElementById('poiAnswers').value = '';
        document.getElementById('poiHint').value = '';
        selectedCoords = null;
        
        loadPOIs();
      } catch (err) {
        document.getElementById('poiMessage').innerHTML = '<div class="error">' + err.message + '</div>';
      }
    }

    async function loadPOIs() {
      try {
        const response = await fetch('/api/epa/poi');
        pois = await response.json();

        const poiList = document.getElementById('poiList');
        poiList.innerHTML = pois.map((poi, idx) => `
          <div class="poi-item">
            <div>
              <strong>${poi.namn}</strong>
              <br><small>${poi.lat.toFixed(4)}, ${poi.lng.toFixed(4)}</small>
            </div>
            <button onclick="deletePOI(${poi.id})">Ta bort</button>
          </div>
        `).join('');

        // Update map
        map.eachLayer(layer => {
          if (layer instanceof L.Marker || layer instanceof L.CircleMarker) {
            map.removeLayer(layer);
          }
        });

        pois.forEach(poi => {
          L.circle([poi.lat, poi.lng], {
            radius: poi.radie_meter,
            color: '#ffff00',
            fillOpacity: 0.1,
            weight: 2
          }).addTo(map);

          L.marker([poi.lat, poi.lng]).addTo(map)
            .bindPopup(poi.namn);
        });
      } catch (err) {
        console.error('Error loading POIs:', err);
      }
    }

    async function deletePOI(poiId) {
      if (!adminPassword || !confirm('Är du säker?')) return;

      try {
        const response = await fetch(`/api/epa/admin/poi/${poiId}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword })
        });

        if (!response.ok) throw new Error('Kunde inte ta bort POI');
        loadPOIs();
      } catch (err) {
        alert('Fel: ' + err.message);
      }
    }

    async function loadPlayers() {
      if (!adminPassword) return;

      try {
        const response = await fetch('/api/epa/admin/players?password=' + encodeURIComponent(adminPassword));
        if (!response.ok) throw new Error('Kunde inte hämta spelare');

        const players = await response.json();
        const playerList = document.getElementById('playerList');

        if (players.length === 0) {
          playerList.innerHTML = '<p style="color: #888;">Inga speler ännu</p>';
          return;
        }

        playerList.innerHTML = players.map(player => {
          const startTime = new Date(player.start_tid);
          const timeString = startTime.toLocaleTimeString('sv-SE');
          return `
            <div class="player-item">
              <div>
                <strong>${player.namn}</strong>
                <br><small>${timeString} - ${player.klar_count}/10 POI</small>
              </div>
              <button onclick="resetPlayer(${player.id})">Nollställ</button>
            </div>
          `;
        }).join('');
      } catch (err) {
        alert('Fel: ' + err.message);
      }
    }

    async function resetPlayer(playerId) {
      if (!adminPassword || !confirm('Nollställ denna speller?')) return;

      try {
        const response = await fetch('/api/epa/admin/reset-player', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword, playerId })
        });

        if (!response.ok) throw new Error('Kunde inte nollställa speller');
        loadPlayers();
      } catch (err) {
        alert('Fel: ' + err.message);
      }
    }

    async function resetAllGames() {
      if (!adminPassword || !confirm('Nollställ ALLA spel? Detta kan inte ångras!')) return;

      try {
        const response = await fetch('/api/epa/admin/reset-all', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword })
        });

        if (!response.ok) throw new Error('Kunde inte nollställa spel');
        loadPlayers();
        alert('Alla spel nollställda');
      } catch (err) {
        alert('Fel: ' + err.message);
      }
    }

    window.addEventListener('load', initMap);
  </script>
</body>
</html>
