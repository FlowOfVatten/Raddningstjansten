<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPA Admin Panel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
    }
    #adminContainer {
      display: flex;
      height: 100vh;
    }
    #mapContainer {
      flex: 1;
      background: #1a1a1a;
    }
    .sidebar {
      width: 350px;
      background: #1a1a1a;
      border-left: 2px solid #ffff00;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    h1 { color: #ffff00; margin-bottom: 1rem; font-size: 1.5rem; }
    h2 { color: #ffff00; margin: 1rem 0 0.5rem 0; font-size: 1.2rem; }
    .form-group {
      margin: 1rem 0;
      display: flex;
      flex-direction: column;
    }
    label {
      color: #ccc;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
    }
    input, textarea, select {
      padding: 0.75rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid #ffff00;
      color: #fff;
      border-radius: 4px;
      font-family: inherit;
    }
    input::placeholder { color: #666; }
    button {
      padding: 0.75rem 1.5rem;
      background: #ff6600;
      border: none;
      color: #000;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin: 0.5rem 0;
    }
    button:hover { background: #ffff00; }
    .poi-list, .player-list {
      border: 1px solid #ffff00;
      padding: 1rem;
      border-radius: 4px;
      margin: 1rem 0;
      background: rgba(255,255,0,0.05);
    }
    .poi-item, .player-item {
      padding: 0.75rem;
      margin: 0.5rem 0;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .poi-item button, .player-item button {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      margin: 0;
    }
    .password-section {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #ffff00;
    }
    .info-text {
      color: #888;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    .success {
      background: #00aa00;
      color: #fff;
      padding: 0.75rem;
      border-radius: 4px;
      margin: 0.5rem 0;
    }
    .error {
      background: #aa0000;
      color: #fff;
      padding: 0.75rem;
      border-radius: 4px;
      margin: 0.5rem 0;
    }
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
    }
    .sidebar-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="adminContainer">
    <div id="mapContainer"></div>
    
    <div class="sidebar">
      <h1>EPA Admin</h1>
      
      <div class="password-section">
        <div class="form-group">
          <label>Admin Lösenord</label>
          <input type="password" id="adminPassword" placeholder="Lösenord">
        </div>
        <button onclick="authenticateAdmin()">Logga in</button>
        <div id="authStatus"></div>
      </div>
      
      <div class="sidebar-content" id="adminContent" style="display: none;">
        <!-- Game Control Section -->
        <div style="border-bottom: 2px solid #ffff00; padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
          <h2 style="margin-bottom: 1rem;">Spelkontroll</h2>
          
          <button onclick="resetGameForNewRound()" style="width: 100%; background: #666; color: #fff; font-weight: bold; margin-bottom: 1rem; padding: 0.75rem;">
            🔄 Nollställ för nytt spel
          </button>
          
          <div id="gameControlSection">
            <h3 style="margin-bottom: 0.5rem; color: #ffff00;">Registrerade spelare:</h3>
            <div id="registeredPlayersList" class="player-list" style="margin-bottom: 1rem; max-height: 200px; overflow-y: auto;"></div>
            
            <button onclick="prepareGame()" class="btn-primary" style="width: 100%; background: #ffff00; color: #000; font-weight: bold; margin-bottom: 0.5rem; padding: 1rem;">
              Start Your Engine 🚀
            </button>
            
            <div id="gameStatus" style="color: #888; font-size: 0.9rem; margin-bottom: 1rem; text-align: center;">
              Status: <strong id="currentGameStatus">Idle</strong>
            </div>
          </div>

          <div id="playersReadySection" style="display: none;">
            <h3 style="margin-bottom: 0.5rem; color: #ffff00;">Anmälda spelare:</h3>
            <div id="readyPlayersList" class="player-list" style="margin-bottom: 1rem; max-height: 200px; overflow-y: auto;"></div>
            
            <button onclick="startGame()" class="btn-primary" style="width: 100%; background: #ff6600; color: #000; font-weight: bold; padding: 1rem; margin-bottom: 1rem;">
              GO 🏁
            </button>
          </div>

          <div id="gameRunningSection" style="display: none;">
            <h3 style="margin-bottom: 1rem; color: #ffff00;">Aktiva spelare:</h3>
            <div id="activePlayers" class="player-list" style="max-height: 300px; overflow-y: auto;"></div>
          </div>
        </div>

        <!-- POI Management Section -->
        <h2>Ny POI</h2>
        <div class="form-group">
          <label>POI Namn</label>
          <input type="text" id="poiName" placeholder="Platsens namn">
        </div>
        <div class="form-group">
          <label>Radie (meter)</label>
          <input type="number" id="poiRadius" value="40" min="10" max="500">
        </div>
        <div class="form-group">
          <label>Fråga</label>
          <textarea id="poiQuestion" placeholder="Frågetexten" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Svarsalternativ (kommaseparerat)</label>
          <textarea id="poiAnswers" placeholder="Svar 1, Svar 2, Svar 3, Svar 4" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Rätt svar (1-4)</label>
          <input type="number" id="poiCorrectAnswer" value="1" min="1" max="4">
        </div>
        <div class="form-group">
          <label>Ledtråd (valfritt)</label>
          <input type="text" id="poiHint" placeholder="En ledande ledtråd">
        </div>
        <div class="form-group" style="flex-direction: row; align-items: center; gap: 0.75rem;">
          <input type="checkbox" id="poiIsFinal" style="width: 18px; height: 18px;">
          <label for="poiIsFinal" style="margin: 0; color: #fff;">Detta är FINAL / mål</label>
        </div>
        <div class="form-group">
          <label style="color: #aaa; font-size: 0.85rem;">Klicka på kartan för att sätta koordinater</label>
          <input type="text" id="poiCoords" readonly placeholder="Lat, Lng" style="opacity: 0.5;">
        </div>
        <button onclick="addPOI()">Lägg till POI</button>
        <div id="poiMessage"></div>

        <h2>POI:er</h2>
        <div id="poiList" class="poi-list"></div>

        <h2>Spelare</h2>
        <button onclick="loadPlayers()">Uppdatera spellista</button>
        <div id="playerList" class="player-list"></div>

        <h2>Åtgärder</h2>
        <div class="sidebar-actions">
          <button onclick="resetAllGames()" style="background: #aa0000;">Nollställ alla spel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Azure Maps configuration (from Brandvatten)
    const AZURE_MAPS_TILE_URL =
      "https://atlas.microsoft.com/map/tile?api-version=2024-04-01&tilesetId=microsoft.base.road&zoom={z}&x={x}&y={y}&tileSize=256&language=sv-SE&view=Auto&subscription-key=";
    const AZURE_MAPS_KEY = "DDyXGJo90rmsvZWRBl8gjVei030IlU4hcBqSgcOJ2n3xiTT1cgnWJQQJ99CDACi5YpzT8CmNAAAgAZMP34PQ";

    let map;
    let adminPassword = null;
    let selectedCoords = null;
    let pois = [];
    let playerMarkers = [];

    function clearPlayerMarkers() {
      playerMarkers.forEach(marker => map.removeLayer(marker));
      playerMarkers = [];
    }

    function renderPlayerMarkers(players) {
      if (!map) return;
      clearPlayerMarkers();

      players.forEach(player => {
        if (player.last_lat == null || player.last_lng == null) return;
        const marker = L.marker([Number(player.last_lat), Number(player.last_lng)]).addTo(map);
        marker.bindPopup(`
          <strong>${player.namn}</strong><br>
          POI klara: ${player.klar_count || 0}
        `);
        playerMarkers.push(marker);
      });
    }

    function initMap() {
      map = L.map('mapContainer').setView([56.88, 15.63], 13);
      L.tileLayer(`${AZURE_MAPS_TILE_URL}${encodeURIComponent(AZURE_MAPS_KEY)}`, {
        maxZoom: 22,
        attribution: '&copy; <a href="https://www.microsoft.com/maps" target="_blank" rel="noreferrer">Microsoft Azure Maps</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a>'
      }).addTo(map);

      map.on('click', (e) => {
        selectedCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
        document.getElementById('poiCoords').value = 
          selectedCoords.lat.toFixed(6) + ', ' + selectedCoords.lng.toFixed(6);
        
        L.circleMarker(e.latlng, {
          radius: 10,
          fillColor: '#ffff00',
          color: '#ffff00',
          weight: 2,
          fillOpacity: 0.7
        }).addTo(map);
      });

      loadPOIs();
    }

    async function authenticateAdmin() {
      adminPassword = document.getElementById('adminPassword').value;
      const authStatus = document.getElementById('authStatus');

      try {
        const response = await fetch('/api/epa/admin/players?password=' + encodeURIComponent(adminPassword));
        if (!response.ok) throw new Error('Autentisering misslyckades');

        document.getElementById('adminContent').style.display = 'block';
        authStatus.innerHTML = '<div class="success">Inloggad</div>';
        
        // Start polling for game status and players
        startGameStatusPoll();
        startPlayersListPoll();
      } catch (err) {
        authStatus.innerHTML = '<div class="error">Felaktigt lösenord</div>';
        adminPassword = null;
      }
    }

    let gameStatusPollInterval = null;
    let playersListPollInterval = null;

    async function resetStaleReadyStateIfNoPlayers() {
      if (!adminPassword) return;

      try {
        const statusResponse = await fetch('/api/epa/game-status');
        if (!statusResponse.ok) return;
        const statusData = await statusResponse.json();

        if (statusData.status !== 'ready') return;

        const playersResponse = await fetch('/api/epa/admin/players-ready?password=' + encodeURIComponent(adminPassword));
        if (!playersResponse.ok) return;

        const players = await playersResponse.json();
        if (!players || players.length === 0) {
          console.warn('Ready state detected without players. Resetting game to idle.');
          await fetch('/api/epa/admin/game-reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: adminPassword })
          });
        }
      } catch (err) {
        console.warn('Could not validate stale ready state:', err);
      }
    }

    async function startGameStatusPoll() {
      if (gameStatusPollInterval) clearInterval(gameStatusPollInterval);
      
      gameStatusPollInterval = setInterval(async () => {
        try {
          const response = await fetch('/api/epa/game-status');
          if (!response.ok) return;
          const data = await response.json();
          
          console.log('Game status:', data.status);

          if (adminPassword && data.status === 'ready') {
            await resetStaleReadyStateIfNoPlayers();
            const refreshedStatus = await (await fetch('/api/epa/game-status')).json();
            if (refreshedStatus.status !== 'ready') return;
          }
          
          document.getElementById('currentGameStatus').textContent = 
            data.status.charAt(0).toUpperCase() + data.status.slice(1);
          
          // Show/hide sections based on game status
          if (data.status === 'idle') {
            document.getElementById('gameControlSection').style.display = 'block';
            document.getElementById('playersReadySection').style.display = 'none';
            document.getElementById('gameRunningSection').style.display = 'none';
          } else if (data.status === 'ready') {
            document.getElementById('gameControlSection').style.display = 'none';
            document.getElementById('playersReadySection').style.display = 'block';
            document.getElementById('gameRunningSection').style.display = 'none';
          } else if (data.status === 'started') {
            document.getElementById('gameControlSection').style.display = 'none';
            document.getElementById('playersReadySection').style.display = 'none';
            document.getElementById('gameRunningSection').style.display = 'block';
          }
        } catch (err) {
          console.error('Error polling game status:', err);
        }
      }, 500);
    }

    async function startPlayersListPoll() {
      if (playersListPollInterval) clearInterval(playersListPollInterval);
      
      playersListPollInterval = setInterval(async () => {
        try {
          const status = await (await fetch('/api/epa/game-status')).json();
          
          if (status.status === 'idle') {
            // Show registered players waiting for engine start
            const response = await fetch('/api/epa/admin/players-ready?password=' + encodeURIComponent(adminPassword));
            if (!response.ok) return;
            const players = await response.json();
            
            const list = document.getElementById('registeredPlayersList');
            if (players.length === 0) {
              list.innerHTML = '<p style="color: #888; padding: 1rem; text-align: center;">Väntar på spelare...</p>';
            } else {
              list.innerHTML = players.map(p => `
                <div class="player-item">
                  <span>${p.namn}</span>
                  <span style="color: #aaa; font-size: 0.9rem;">Registrerad</span>
                </div>
              `).join('');
            }
          } else if (status.status === 'ready') {
            // Show ready players
            const response = await fetch('/api/epa/admin/players-ready?password=' + encodeURIComponent(adminPassword));
            if (!response.ok) return;
            const players = await response.json();
            
            const list = document.getElementById('readyPlayersList');
            list.innerHTML = players.map(p => `
              <div class="player-item">
                <span>${p.namn}</span>
                <span style="color: #aaa; font-size: 0.9rem;">Redo</span>
              </div>
            `).join('');
          } else if (status.status === 'started') {
            // Show active players
            const response = await fetch('/api/epa/admin/players?password=' + encodeURIComponent(adminPassword));
            if (!response.ok) return;
            const players = await response.json();
            
            const list = document.getElementById('activePlayers');
            const totalPois = Math.max(1, pois.length || 1);
            renderPlayerMarkers(players);
            list.innerHTML = players.map(p => {
              const completedCount = p.klar_count || 0;
              const progress = `${completedCount} av ${totalPois}`;
              const progressPercent = Math.min(100, (completedCount / totalPois) * 100);
              const locText = (p.last_lat != null && p.last_lng != null)
                ? ` <span style="color: #63d2ff;">📍 Live</span>`
                : ' <span style="color: #aaa;">📍 Okänd</span>';
              return `
                <div class="player-item">
                  <div style="flex: 1;">
                    <div><strong>${p.namn}</strong>${locText}</div>
                    <div style="width: 100%; height: 8px; background: #333; border-radius: 4px; margin-top: 4px; overflow: hidden;">
                      <div style="width: ${progressPercent}%; height: 100%; background: #ffff00; transition: width 0.3s;"></div>
                    </div>
                    <div style="font-size: 0.85rem; color: #aaa; margin-top: 4px;">${progress}</div>
                  </div>
                </div>
              `;
            }).join('');
          }
        } catch (err) {
          console.error('Error polling players:', err);
        }
      }, 2000);
    }

    async function resetGameForNewRound() {
      if (!adminPassword) {
        alert('Du är inte inloggad');
        return;
      }
      
      if (!confirm('Nollställ spelet för en ny körning? Detta återställer statusen till idle.')) {
        return;
      }

      try {
        const response = await fetch('/api/epa/admin/game-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword })
        });
        
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error('API error: ' + (errorData.error || 'Unknown error'));
        }
        
        alert('Spelet är nollställt. Statusen är nu idle.');
        
        // Refresh the UI by clearing intervals and restarting them
        clearInterval(gameStatusPollInterval);
        clearInterval(playersListPollInterval);
        startGameStatusPoll();
        startPlayersListPoll();
      } catch (err) {
        console.error('Error resetting game:', err);
        alert('Fel: ' + err.message);
      }
    }

    async function prepareGame() {
      console.log('prepareGame called');
      
      if (!adminPassword) {
        alert('Fel: Du är inte inloggad som admin');
        return;
      }
      
      try {
        console.log('Calling /api/epa/admin/game-start');
        const response = await fetch('/api/epa/admin/game-start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword })
        });
        
        console.log('Response status:', response.status);
        
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error('API error: ' + (errorData.error || 'Unknown error'));
        }
        
        const data = await response.json();
        console.log('Game started, sessionId:', data.sessionId);
        
        // Broadcast the "gentlemen start your engines" sound to all players
        try {
          console.log('Broadcasting sound');
          await fetch(`/api/epa/admin/broadcast-sound`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: adminPassword, sessionId: data.sessionId, soundId: 'gentlemen-start-engines' })
          });
          console.log('Sound broadcast sent');
        } catch (e) {
          console.error('Could not broadcast sound:', e);
        }
        
        alert('Spel förberett! Spelare kan nu registrera sig.\nKlicka "GO" när alla är redo.');
      } catch (err) {
        console.error('Error in prepareGame:', err);
        alert('Fel: ' + err.message);
      }
    }

    async function startGame() {
      const status = await (await fetch('/api/epa/game-status')).json();
      
      try {
        const response = await fetch('/api/epa/admin/game-go', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword, sessionId: status.sessionId })
        });
        
        if (!response.ok) throw new Error('Kunde inte starta spel');
        
        alert('SPELET STARTAT! 🏁');
      } catch (err) {
        alert('Fel: ' + err.message);
      }
    }


    async function addPOI() {
      if (!adminPassword || !selectedCoords) {
        alert('Logga in och klicka på kartan för att sätta koordinater');
        return;
      }

      const poiName = document.getElementById('poiName').value;
      const poiRadius = parseInt(document.getElementById('poiRadius').value);
      const poiQuestion = document.getElementById('poiQuestion').value.trim();
      const poiAnswers = document.getElementById('poiAnswers').value.split(',').map(s => s.trim());
      const correctAnswer = parseInt(document.getElementById('poiCorrectAnswer').value) - 1;
      const poiHint = document.getElementById('poiHint').value;
      const isFinal = document.getElementById('poiIsFinal').checked;

      if (!poiName || (!isFinal && (!poiQuestion || poiAnswers.length < 2))) {
        alert(isFinal ? 'Fyll i namn och koordinater för målet' : 'Fyll i alla obligatoriska fält');
        return;
      }

      try {
        // Add POI
        const poiResponse = await fetch('/api/epa/admin/poi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: adminPassword,
            namn: poiName,
            lat: selectedCoords.lat,
            lng: selectedCoords.lng,
            radieMeter: poiRadius
          })
        });

        if (!poiResponse.ok) throw new Error('Kunde inte lägga till POI');
        const poiData = await poiResponse.json();

        if (!isFinal) {
          // Add question
          const questionResponse = await fetch(`/api/epa/admin/poi/${poiData.id}/question`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              password: adminPassword,
              text: poiQuestion,
              alternativ: poiAnswers,
              rattIndex: correctAnswer,
              ledtrad: poiHint || null
            })
          });

          if (!questionResponse.ok) throw new Error('Kunde inte lägga till fråga');
        }

        document.getElementById('poiMessage').innerHTML = '<div class="success">POI tillagd!' + (isFinal ? ' (final / mål utan fråga)' : '') + '</div>';
        document.getElementById('poiName').value = '';
        document.getElementById('poiQuestion').value = '';
        document.getElementById('poiAnswers').value = '';
        document.getElementById('poiHint').value = '';
        document.getElementById('poiIsFinal').checked = false;
        selectedCoords = null;
        
        loadPOIs();
      } catch (err) {
        document.getElementById('poiMessage').innerHTML = '<div class="error">' + err.message + '</div>';
      }
    }

    async function loadPOIs() {
      try {
        const response = await fetch('/api/epa/poi');
        pois = await response.json();

        // Ensure lat/lng are numbers
        pois = pois.map(poi => ({
          ...poi,
          lat: Number(poi.lat),
          lng: Number(poi.lng),
          radie_meter: Number(poi.radie_meter)
        }));

        const poiList = document.getElementById('poiList');
        const goalPoi = pois.length > 0 ? pois[pois.length - 1] : null;
        poiList.innerHTML = pois.map((poi, idx) => {
          const isGoal = goalPoi && poi.id === goalPoi.id;
          return `
            <div class="poi-item">
              <div>
                <strong>${poi.namn}</strong>
                ${isGoal ? '<br><small style="color: #ffb703; font-weight: 700;">🏁 Final POI (mål)</small>' : '<br><small>Checkpunkt</small>'}
                <br><small>${poi.lat.toFixed(4)}, ${poi.lng.toFixed(4)}</small>
              </div>
              <div style="display: flex; flex-direction: column; gap: 0.35rem;">
                <button onclick="movePOI(${poi.id}, -1)">↑</button>
                <button onclick="movePOI(${poi.id}, 1)">↓</button>
                <button onclick="setFinalPOI(${poi.id})">${isGoal ? 'Final' : 'Sätt som final'}</button>
                <button onclick="deletePOI(${poi.id})">Ta bort</button>
              </div>
            </div>
          `;
        }).join('');

        // Update map
        map.eachLayer(layer => {
          if (layer instanceof L.Marker || layer instanceof L.CircleMarker) {
            map.removeLayer(layer);
          }
        });

        pois.forEach((poi, idx) => {
          const isGoal = goalPoi && poi.id === goalPoi.id;
          L.circle([poi.lat, poi.lng], {
            radius: poi.radie_meter,
            color: isGoal ? '#ff4d4d' : '#ffff00',
            fillOpacity: isGoal ? 0.18 : 0.1,
            weight: 2
          }).addTo(map);

          L.marker([poi.lat, poi.lng]).addTo(map)
            .bindPopup(`${poi.namn}${isGoal ? ' (Final POI / mål)' : ''}`);
        });
      } catch (err) {
        console.error('Error loading POIs:', err);
      }
    }

    async function savePoiOrder() {
      if (!adminPassword) return;

      try {
        const response = await fetch('/api/epa/admin/poi/reorder', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword, order: pois.map(poi => poi.id) })
        });

        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error || 'Kunde inte uppdatera POI-ordning');
        }
      } catch (err) {
        alert('Fel: ' + err.message);
      }
    }

    async function movePOI(poiId, direction) {
      const currentIndex = pois.findIndex(poi => poi.id === poiId);
      if (currentIndex === -1) return;

      const nextIndex = currentIndex + direction;
      if (nextIndex < 0 || nextIndex >= pois.length) return;

      const reordered = [...pois];
      const [item] = reordered.splice(currentIndex, 1);
      reordered.splice(nextIndex, 0, item);
      pois = reordered;
      await savePoiOrder();
      loadPOIs();
    }

    async function setFinalPOI(poiId) {
      const currentIndex = pois.findIndex(poi => poi.id === poiId);
      if (currentIndex === -1) return;

      const reordered = [...pois.filter(poi => poi.id !== poiId)];
      reordered.push(pois[currentIndex]);
      pois = reordered;
      await savePoiOrder();
      loadPOIs();
    }

    async function deletePOI(poiId) {
      if (!adminPassword || !confirm('Är du säker?')) return;

      try {
        const response = await fetch(`/api/epa/admin/poi/${poiId}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword })
        });

        if (!response.ok) throw new Error('Kunde inte ta bort POI');
        loadPOIs();
      } catch (err) {
        alert('Fel: ' + err.message);
      }
    }

    async function loadPlayers() {
      if (!adminPassword) return;

      try {
        const response = await fetch('/api/epa/admin/players?password=' + encodeURIComponent(adminPassword));
        if (!response.ok) throw new Error('Kunde inte hämta spelare');

        const players = await response.json();
        const playerList = document.getElementById('playerList');
        renderPlayerMarkers(players);

        if (players.length === 0) {
          playerList.innerHTML = '<p style="color: #888;">Inga speler ännu</p>';
          return;
        }

        const totalPois = Math.max(1, pois.length || 1);
        playerList.innerHTML = players.map(player => {
          const startTime = new Date(player.start_tid);
          const timeString = startTime.toLocaleTimeString('sv-SE');
          const locationInfo = (player.last_lat != null && player.last_lng != null)
            ? `<br><small style="color: #63d2ff;">Sista position: ${Number(player.last_lat).toFixed(4)}, ${Number(player.last_lng).toFixed(4)}</small>`
            : '<br><small style="color: #aaa;">Ingen position registrerad</small>';
          return `
            <div class="player-item">
              <div>
                <strong>${player.namn}</strong>
                <br><small>${timeString} - ${player.klar_count}/${totalPois} POI</small>
                ${locationInfo}
              </div>
              <button onclick="resetPlayer(${player.id})">Nollställ</button>
            </div>
          `;
        }).join('');
      } catch (err) {
        alert('Fel: ' + err.message);
      }
    }

    async function resetPlayer(playerId) {
      if (!adminPassword || !confirm('Nollställ denna speller?')) return;

      try {
        const response = await fetch('/api/epa/admin/reset-player', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword, playerId })
        });

        if (!response.ok) throw new Error('Kunde inte nollställa speller');
        loadPlayers();
      } catch (err) {
        alert('Fel: ' + err.message);
      }
    }

    async function resetAllGames() {
      if (!adminPassword || !confirm('Nollställ ALLA spel? Detta kan inte ångras!')) return;

      try {
        const response = await fetch('/api/epa/admin/reset-all', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword })
        });

        if (!response.ok) throw new Error('Kunde inte nollställa spel');
        loadPlayers();
        alert('Alla spel nollställda');
      } catch (err) {
        alert('Fel: ' + err.message);
      }
    }

    window.addEventListener('load', initMap);
  </script>
</body>
</html>
