name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false

      - name: Validate required config secrets
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          SQL_CONNECTION_STRING_URF: ${{ secrets.SQL_CONNECTION_STRING_URF }}
        run: |
          if [ -z "$SQL_CONNECTION_STRING" ]; then
            echo "Missing SQL_CONNECTION_STRING in GitHub Secrets"
            exit 1
          fi
          if [ -z "$SQL_CONNECTION_STRING_URF" ]; then
            echo "Missing SQL_CONNECTION_STRING_URF in GitHub Secrets"
            exit 1
          fi

      - name: Install API dependencies
        run: npm install --prefix api

      - name: Setup Node for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Familjelistan frontend
        run: |
          npm install --prefix Familjelistan/client
          npm run build --prefix Familjelistan/client

      - name: Build And Deploy
        id: builddeploy_primary
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          SQL_CONNECTION_STRING_URF: ${{ secrets.SQL_CONNECTION_STRING_URF }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_ISLAND_0A12CD003 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "/"

      - name: Build And Deploy (retry once)
        id: builddeploy_retry
        if: steps.builddeploy_primary.outcome == 'failure'
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          SQL_CONNECTION_STRING_URF: ${{ secrets.SQL_CONNECTION_STRING_URF }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_ISLAND_0A12CD003 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "/"

      - name: Fail if deploy failed twice
        if: steps.builddeploy_primary.outcome == 'failure' && steps.builddeploy_retry.outcome == 'failure'
        run: |
          echo "Azure Static Web Apps deploy failed twice."
          exit 1

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_ISLAND_0A12CD003 }}
          action: "close"