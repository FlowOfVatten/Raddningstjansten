<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOS – Insatsledarvyn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="command-view">
    <header class="header">
      <h1>🚒 SOS – Insatsledning</h1>
      <div class="header-info">
        <span id="fire-count" class="badge">0 aktiv</span>
        <span id="sos-count" class="badge badge-sos">0 SOS</span>
        <span id="last-update" class="timestamp">-</span>
      </div>
    </header>

    <main class="layout">
      <section class="map-container">
        <div id="map" aria-label="Karta över brandmän"></div>
      </section>

      <aside class="sidebar">
        <h2>Aktiva insatser</h2>
        <ul id="firefighter-list" class="firefighter-list">
          <li class="empty">Väntar på positioner...</li>
        </ul>

        <div class="sidebar-actions">
          <button id="clear-btn" class="btn btn-secondary">Rensa data</button>
          <button id="refresh-btn" class="btn btn-primary">Uppdatera nu</button>
        </div>
      </aside>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js" defer></script>
  </body>
</html>
