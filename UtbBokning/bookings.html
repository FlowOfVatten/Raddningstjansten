<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Befintliga bokningar – Bokning Utbildning</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="topbar panel">
        <div class="topbar-left">
          <img src="brf_logo (2).svg" alt="Logotyp" class="topbar-logo" />
          <h1 class="topbar-title">Befintliga bokningar</h1>
        </div>
        <div class="topbar-actions">
          <span id="profileStatePill" class="status-text"></span>
          <a class="ghost-button" href="index.html">Ny bokning</a>
          <a id="resurserLink" class="ghost-button" href="resources.html" hidden>Resurser</a>
        </div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Aktiva &amp; kommande</p>
            <h2>Bokningar</h2>
          </div>
          <p id="bookingsStatus" class="status-text">Laddar bokningar…</p>
        </div>
        <div id="activeBookingsList" class="bookings-list">
          <p class="helper-text">Inga aktiva bokningar.</p>
        </div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Historik</p>
            <h2>Arkiverade övningar</h2>
          </div>
        </div>
        <div id="archivedBookingsList" class="bookings-list bookings-list--archived">
          <p class="helper-text">Inga arkiverade övningar.</p>
        </div>
      </section>
    </main>

    <!-- Detail modal -->
    <div id="bookingDetailModal" class="modal-overlay" hidden>
      <div class="modal-box modal-box--wide" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
        <div class="modal-detail-header">
          <h2 id="detailModalTitle" class="modal-title">Bokningsdetaljer</h2>
          <button type="button" class="link-button modal-close-btn" id="detailModalClose">Stäng ✕</button>
        </div>
        <div id="detailModalBody" class="modal-detail-body"></div>
        <div class="modal-detail-actions" id="detailModalActions"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
