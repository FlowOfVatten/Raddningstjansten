<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brandvatten</title>
    <script>
      // SWA can serve this page at /Brandvatten (no trailing slash),
      // which breaks relative asset paths. Normalize URL early.
      if (/\/Brandvatten$/i.test(window.location.pathname)) {
        window.location.replace(`${window.location.pathname}/${window.location.search}${window.location.hash}`);
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260421" />
    <link rel="shortcut icon" href="favicon.svg?v=20260421" />
    <link rel="apple-touch-icon" href="favicon.svg?v=20260421" />
    <link rel="stylesheet" href="vendor/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="top-controls">
      <button id="show-map-view" type="button" class="btn-primary">Kartvy</button>
      <button id="show-list-view" type="button" class="btn-secondary">Listvy</button>
      <button id="locate-btn" type="button" class="btn-secondary">Ga till narmaste</button>
    </div>

    <section id="map-view" class="view view-active" aria-label="Kartvy">
      <main id="map" aria-label="Karta med brandvattenpunkter"></main>
      <section class="map-info" aria-live="polite">
        <div id="status" class="status">Hämtar telefonens position...</div>
        <article id="selected-card" class="card hidden">
          <div class="card-title">Vald punkt</div>
          <img id="selected-image" alt="Bild för vald punkt" />
          <h2 id="selected-name"></h2>
          <div id="selected-coords" class="destination-coords"></div>
          <p id="selected-desc"></p>
          <div class="meta-row" id="selected-meta"></div>
          <div class="button-row">
            <button id="selected-route-btn" type="button" class="btn-primary">Visa rutt</button>
            <button id="selected-nav-btn" type="button" class="btn-secondary">Navigera hit</button>
          </div>
          <div id="directions" class="directions"></div>
        </article>
      </section>
    </section>

    <section id="list-view" class="view" aria-label="Listvy">
      <div class="list-page">
        <h1>Brandvattenpunkter</h1>
        <p>Sorterad lista med närmaste punkt överst.</p>
        <div id="list-status" class="status">Väntar på position för sortering...</div>
        <div id="destination-list" class="destination-list"></div>
      </div>
    </section>

    <script src="vendor/leaflet.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
